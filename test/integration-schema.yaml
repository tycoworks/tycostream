# Global enum definitions
enums:
  user_rank:
    - bronze
    - silver
    - gold
    - platinum

sources:
  # First source - covers string, boolean, time, and json types
  users:
    primary_key: user_id
    columns:
      user_id: int4
      name: text
      email: varchar
      active: bool
      rank: user_rank  # Enum field
      created_at: timestamp
      updated_at: timestamptz
      metadata: jsonb  # Materialize stores JSON as jsonb

  # Comprehensive test table with ALL PostgreSQL types
  all_types:
    primary_key: id
    columns:
      id: int4
      # Boolean
      bool_val: bool
      # Numeric types
      smallint_val: int2
      int_val: int4
      bigint_val: int8
      decimal_val: numeric
      numeric_val: numeric
      real_val: float4
      double_val: float8
      # String types
      char_val: bpchar
      varchar_val: varchar
      text_val: text
      uuid_val: uuid
      # Date/Time types
      date_val: date
      time_val: time
      timestamp_val: timestamp
      timestamptz_val: timestamptz
      # JSON types, both jsonb in Materialize
      json_val: jsonb
      jsonb_val: jsonb

  # Positions, their trades, and each trade's account, related by the
  # trades' foreign keys
  positions:
    primary_key: instrument_id
    columns:
      instrument_id: int4
      symbol: text
      net_position: int8

  accounts:
    primary_key: id
    columns:
      id: int4
      name: text

  trades:
    primary_key: id
    columns:
      id: int4
      instrument_id: int4
      account_id: int4
      quantity: int4
    foreign_keys:
      instrument_id: positions
      account_id: accounts

  # Its one row takes Materialize seconds to work out, so a query of it is
  # still running when its client leaves
  slow_count:
    primary_key: id
    columns:
      id: int4
