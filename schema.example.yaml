enums:
  side:
    - buy
    - sell

sources:
  positions:
    primary_key: instrument_id
    columns:
      instrument_id: Integer
      symbol: String
      net_position: BigInt
      last_price: Float
      market_value: Float
      realized_pnl: Float
      unrealized_pnl: Float

  trades:
    primary_key: id
    columns:
      id: Integer
      instrument_id: Integer
      side: side
      quantity: Integer
      price: Float
      executed_at: Timestamp
