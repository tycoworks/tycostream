name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the image and draft the release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # to draft the release
      packages: write # to push the image
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi

      - name: Choose the image's tags
        id: tags
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          tags="$image:$GITHUB_REF_NAME"
          # A pre-release, such as v1.0.0-rc.1, doesn't move latest
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
