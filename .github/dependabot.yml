version: 2
updates:
  # Minor and patch updates come together each month; each major update on its own
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Its major version follows the Node the image runs (24), not the latest
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Until typescript-eslint supports TypeScript 7
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
