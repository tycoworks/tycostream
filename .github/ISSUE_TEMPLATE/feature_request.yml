name: Feature request
description: Something you'd like tycostream to do
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What you want to do
      description: What you're building, and what tycostream can't do for it today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How it could work
      description: An example query, subscription, or schema.yaml, if you have one in mind.
